name: Windows Desktop Build Validation

on:
  push:
    branches:
      - fix/electron-42-prebuild-abi

permissions:
  contents: read

concurrency:
  group: win-desktop-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Desktop Package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron runtime
        shell: pwsh
        env:
          electron_config_cache: ${{ runner.temp }}/.cache/electron
        run: |
          if (!(Test-Path 'node_modules/electron/dist/electron.exe')) {
            node node_modules/electron/install.js
          }
          if (!(Test-Path 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron runtime download completed without node_modules/electron/dist/electron.exe'
          }

      - name: Verify Electron 42 ABI is known to prebuild-install
        shell: pwsh
        run: |
          node --input-type=module -e "import { getAbi } from 'node-abi'; const abi = getAbi('42.0.1', 'electron'); console.log('root node-abi version:', (await import('node-abi/package.json', { with: { type: 'json' } })).default.version); console.log('Electron 42 ABI:', abi); if (abi !== '146') process.exit(1)"

      - name: Build Windows desktop artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npm run package:desktop

      - name: Smoke test packaged SQLite native module
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: 1
        run: |
          $appRoot = Join-Path $PWD 'release\win-unpacked\resources\app'
          $exePath = Join-Path $PWD 'release\win-unpacked\Metapi.exe'
          if (!(Test-Path $appRoot) -or !(Test-Path $exePath)) {
            throw 'Expected packaged Windows app was not created'
          }
          Push-Location $appRoot
          try {
            & $exePath -e "const db = require('better-sqlite3'); const d = new db(':memory:'); d.exec('CREATE TABLE t(x); INSERT INTO t VALUES (42)'); if (d.prepare('SELECT x FROM t').get().x !== 42) process.exit(1); console.log('better-sqlite3 smoke test passed')"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }

      - name: Upload Windows installer (EXE)
        uses: actions/upload-artifact@v7
        with:
          name: metapi-windows-installer-${{ github.run_id }}
          path: release/*-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows portable package (ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: metapi-windows-portable-${{ github.run_id }}
          path: release/*-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows update metadata
        uses: actions/upload-artifact@v7
        with:
          name: metapi-windows-update-metadata-${{ github.run_id }}
          path: |
            release/*.blockmap
            release/latest*.yml
            release/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 30
